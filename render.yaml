databases:
  - name: gymtrack-db
    plan: free
    databaseName: gymtrack
    user: gymtrack

services:
  - type: web
    name: gymtrack
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gymtrack-db
          property: connectionString
